name: Alpha Vantage Xetra ticker test (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check eight ticker daily series
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python tools/check_alpha_tickers.py
      - name: Attach results
        uses: actions/upload-artifact@v4
        with:
          name: alpha-ticker-result
          path: alpha_ticker_result.json
          retention-days: 1
# No scheduled calls, no secret output, no Supabase write.
